debug: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

auth:
  jwt-secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  access-token-ttl-seconds: 900
  refresh-token-ttl-days: 30
  game-ticket-ttl-seconds: 900
  server-id: obsidiangate-main

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
